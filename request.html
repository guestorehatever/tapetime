<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit a Request — TapeTime Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--vcr-black:#0a0f16;--vcr-black-2:#111925;--cream:#f2ede1;--cream-dim:#c9c3b4;--magenta:#ff7a3d;--cyan:#4fb2ff;--warn-yellow:#ffb066;--line:rgba(242,237,225,0.14);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--vcr-black);color:var(--cream);font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6;}
  h1,h2,h3{font-family:'VT323',monospace;font-weight:400;letter-spacing:.02em;}
  a{color:var(--cyan);}
  .scanlines{pointer-events:none;position:fixed;inset:0;z-index:50;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.08) 3px,rgba(0,0,0,0) 4px);mix-blend-mode:overlay;opacity:.5;}
  header{border-bottom:1px solid var(--line);background:rgba(10,10,15,.85);}
  .nav{max-width:760px;margin:0 auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .nav img{display:block;height:32px;width:auto;filter:drop-shadow(0 0 6px rgba(242,237,225,.85)) drop-shadow(0 0 16px rgba(242,237,225,.4));}
  .nav a.back{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--cream-dim);text-decoration:none;}
  .nav a.back:hover{color:var(--cyan);}
  main{max-width:760px;margin:0 auto;padding:40px 20px 70px;}
  .eyebrow{font-family:'VT323',monospace;color:var(--magenta);font-size:18px;text-transform:uppercase;letter-spacing:.12em;margin:0 0 6px;}
  h1{font-size:clamp(34px,7vw,52px);line-height:1;margin:0 0 14px;text-shadow:2px 0 var(--cyan),-2px 0 var(--magenta);}
  .lead{color:var(--cream-dim);margin:0 0 28px;}
  .panel{background:linear-gradient(180deg,var(--vcr-black-2),#0d0d14);border:2px solid #2a2836;border-radius:14px;padding:28px 30px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);}
  .btn{display:inline-block;border:0;cursor:pointer;background:var(--warn-yellow);color:var(--vcr-black);font-family:'VT323',monospace;font-size:22px;padding:12px 26px;text-decoration:none;border-radius:2px;box-shadow:4px 4px 0 var(--magenta);transition:transform .12s ease;}
  .btn:hover:not(:disabled){transform:translate(-2px,-2px);}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
  @media (max-width:600px){.panel{padding:20px 16px;}}
  label.f{display:block;margin:0 0 18px;font-size:14px;color:var(--cream);}
  label.f .opt{color:var(--cream-dim);font-size:12px;}
  input[type=text],input[type=tel],input[type=email],textarea{display:block;width:100%;margin-top:6px;background:#0a0f16;color:var(--cream);border:1px solid var(--line);border-radius:4px;padding:11px 12px;font:inherit;font-size:16px;}
  input:focus,textarea:focus{outline:2px solid var(--cyan);outline-offset:1px;}
  textarea{min-height:110px;resize:vertical;}
  .hp{position:absolute;left:-9999px;opacity:0;height:0;width:0;}
  .msg{margin:16px 0 0;font-size:14px;min-height:20px;color:var(--warn-yellow);}
  .hint{color:var(--cream-dim);font-size:12px;margin:2px 0 0;}
</style>
</head>

<div class="eyebrow">Step 2 of 2</div>
<h1>Submit a request</h1>
<p class="lead">Tell us about your tapes and we’ll get back to you by phone or email.</p>
<form class="panel" id="req" novalidate>
  <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
  <label class="f">Name
    <input type="text" name="Name" autocomplete="name" required>
  </label>
  <label class="f">Content <span class="opt">— what’s on the tapes and how many?</span>
    <textarea name="Content" placeholder="e.g. 6 family home-video tapes from the 90s, mostly 2-hour" required></textarea>
  </label>
  <label class="f">Phone number
    <input type="tel" name="Phone" autocomplete="tel" inputmode="tel" required>
  </label>
  <label class="f">Email
    <input type="email" name="Email" autocomplete="email" required>
  </label>
  <label class="f">Extra <span class="opt">(optional)</span>
    <textarea name="Extra" placeholder="Bundles, extra copies, deadlines, questions…"></textarea>
  </label>
  <button class="btn" type="submit" id="send">SEND REQUEST ▶</button>
  <p class="msg" id="msg" role="status"></p>
</form>
<script>
  // Require the disclaimer step first
  var ok=false;
  try{ ok=!!sessionStorage.getItem('tt_agreed'); }catch(e){}
  if(!ok && location.search.indexOf('agreed=1')===-1){ location.replace('disclaimer.html'); }

  var form=document.getElementById('req'), msg=document.getElementById('msg'), btn=document.getElementById('send');
  form.addEventListener('submit',function(e){
    e.preventDefault();
    msg.textContent='';
    var d=new FormData(form);
    if(d.get('_honey')) return;
    var need=['Name','Content','Phone','Email'];
    for(var i=0;i<need.length;i++){ if(!String(d.get(need[i])||'').trim()){ msg.textContent='Please fill in: '+need[i]+'.'; return; } }
    if(!/^\S+@\S+\.\S+$/.test(d.get('Email'))){ msg.textContent='Please enter a valid email address.'; return; }
    var body={
      _subject:'TapeTime Digital — new request from '+d.get('Name'),
      _template:'table', _captcha:'false',
      Name:d.get('Name'), Content:d.get('Content'), Phone:d.get('Phone'),
      Email:d.get('Email'), Extra:d.get('Extra')||'(none)',
      'Agreed to disclaimer':'Yes — '+(function(){try{return sessionStorage.getItem('tt_agreed')||'';}catch(e){return '';}})()
    };
    btn.disabled=true; btn.textContent='SENDING…';
    fetch('https://formsubmit.co/ajax/giobecerra018@gmail.com',{
      method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body:JSON.stringify(body)
    }).then(function(r){return r.json();}).then(function(j){
      if(j && (j.success===true||j.success==='true')){ location.href='thanks.html'; }
      else { throw new Error((j&&j.message)||'failed'); }
    }).catch(function(){
      btn.disabled=false; btn.textContent='SEND REQUEST ▶';
      msg.textContent='Something went wrong sending your request. Please try again in a moment.';
    });
  });
</script>
</main>
